# GRPO interleaved reasoning training config
# Uses the same ThinkMorph datasets as thinkmorph_reasoning.yaml
# but intended for GRPO RL fine-tuning (prompt + GT answer extraction).

thinkmorph_reasoning:
  dataset_names:
  - Jigsaw_Assembly
  # - Spatial_Navigation
  # - Visual_Search
  # - Chart_Refocus
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 518
    min_image_size: 224
  is_mandatory: true
  num_used_data:
  - 6000
  - 6000
  - 6990
  - 6000
  weight: 1
